name: Kartenlisten aktualisieren und App veröffentlichen

on:
  schedule:
    - cron: '23 4 */3 * *'   # alle 3 Tage um 04:23 UTC
  workflow_dispatch: {}        # von Hand: Actions → "Run workflow"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Neueste Karten, Skripte und Verbotslisten von ProjectIgnis holen
        run: bash tools/fetch-sources.sh "$RUNNER_TEMP/src" | tee sources/versions.txt
      - name: Daten und App neu bauen
        env:
          SRC: ${{ runner.temp }}/src
        run: bash tools/rebuild.sh
      - name: Probeduelle mit dem Spielkern (Abbruch bei Fehlern)
        run: |
          N=30 node test/packed-smoke.mjs | tee smoke.txt
          grep -q "Lua-Fehler \[\]" smoke.txt
      - name: Kombo-Suche (Nachspiel ergibt exakt das gefundene Board)
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/combo-search.mjs ryzeal
      - name: Störkarten, Deck-Analyse, Ziehvorschau
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/interrupts.mjs
      - name: Tutor-Suche mitten im Duell (Nachspielen der Antworten)
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/tutor-replay.mjs
      - name: Kombo-Bibliothek (gespeicherte Kombo wird sofort wiedergefunden)
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/combo-guides.mjs
      - name: Einmal-pro-Spielzug-Sperre
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/opt-limit.mjs
      - name: Schiedsrichter-Fälle (Regelprüfung)
        env:
          SRC: ${{ runner.temp }}/src
        run: node test/rulings.mjs
      - name: Skript-Korrekturen und Abgleich Kartentext/Skript
        env:
          SRC: ${{ runner.temp }}/src
        run: |
          node test/script-fixes.mjs
          node test/opt-audit.mjs
      - name: Geänderte Listen im Repository sichern
        run: |
          git config user.name "duellraum-bot"
          git config user.email "duellraum-bot@users.noreply.github.com"
          date -u +%F > sources/stand.txt   # Herzschlag: hält den 3-Tage-Zeitplan bei GitHub aktiv
          git add sources/stand.txt data/lists.json data/decks.json data/decks-raw.json data/strings.json sources
          git diff --cached --quiet || (git commit -m "Automatische Aktualisierung $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
